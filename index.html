    <!-- La hoja de Google Fonts bloqueaba el render 844 ms. Con media="print" el
         navegador la descarga sin bloquear y `onload` la activa al llegar. El
         texto se pinta antes con la fuente de sistema y cambia al cargar, que es
         justo lo que ya hacía `display=swap`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@800&display=swap"

    <!--
      Google Analytics 4. El ID sale de src/data/analytics.ts: el plugin
      `analyticsHtml` de vite.config.ts sustituye __GA_MEASUREMENT_ID__ al
      compilar, y en desarrollo quita el bloque entero para no ensuciar los datos.

      gtag.js (~150 KB, casi todo JS que ejecutar) no entra en el camino
      crítico: se pide después del evento `load` y en un hueco ocioso del hilo
      principal. Hasta entonces `gtag()` solo apila en `dataLayer`, y la vista
      que React registra al montar se envía en cuanto llega el script.

      `send_page_view: false` porque las vistas, la inicial incluida, las
      registra React en cada cambio de ruta (src/lib/analytics.ts).
    -->
    <!-- ga:inicio -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', '__GA_MEASUREMENT_ID__', { send_page_view: false })
      addEventListener('load', function () {
        function cargar() {
          var s = document.createElement('script')
          s.async = true
          s.src = 'https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__'
          document.head.appendChild(s)
        }
        if ('requestIdleCallback' in window) requestIdleCallback(cargar, { timeout: 3000 })
        else setTimeout(cargar, 1)
      })
    </script>
    <!-- ga:fin -->
