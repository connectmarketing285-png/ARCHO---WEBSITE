<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ARCHO — Diseño y construcción, un solo proceso.</title>
    <!--
      Este <title> es solo para `vite dev`. En el build, tools/prerenderizar.mjs
      lo quita y escribe en cada página su <title>, description, canónica,
      etiquetas Open Graph y (en la portada) el JSON-LD, todo desde
      src/data/seo.ts. No añadir aquí metadatos por ruta: se duplicarían.
    -->
    <meta name="author" content="ARCHO Estudio" />
    <meta name="theme-color" content="#0A0A0A" />

    <!--
      Todos salen del mismo dibujo: isotipo blanco al 64% del alto sobre el
      negro del sitio, opaco y centrado ópticamente (ver README, "Favicon").
      El de 192 es el que toma Google: pide múltiplos de 48 px y lo recorta a
      círculo en los resultados. El .ico (16/32/48) es para navegadores y
      lectores que piden /favicon.ico sin leer el HTML.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- El logo es el elemento LCP de la home (marca de agua del hero) y además
         aparece en la cabecera y el pie de todas las rutas. -->
    <link rel="preload" as="image" href="/archo-isotipo.png" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La hoja de Google Fonts bloqueaba el render 844 ms. Con media="print" el
         navegador la descarga sin bloquear y `onload` la activa al llegar. El
         texto se pinta antes con la fuente de sistema y cambia al cargar, que es
         justo lo que ya hacía `display=swap`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@800&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@800&display=swap"
      />
    </noscript>

    <!--
      Google Analytics 4. El ID sale de src/data/analytics.ts: el plugin
      `analyticsHtml` de vite.config.ts sustituye __GA_MEASUREMENT_ID__ al
      compilar, y en desarrollo quita el bloque entero para no ensuciar los datos.

      gtag.js (~150 KB, casi todo JS que ejecutar) no entra en el camino
      crítico: se pide después del evento `load` y en un hueco ocioso del hilo
      principal. Hasta entonces `gtag()` solo apila en `dataLayer`, y la vista
      que React registra al montar se envía en cuanto llega el script.

      `send_page_view: false` porque las vistas, la inicial incluida, las
      registra React en cada cambio de ruta (src/lib/analytics.ts).
    -->
    <!-- ga:inicio -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', '__GA_MEASUREMENT_ID__', { send_page_view: false })
      addEventListener('load', function () {
        function cargar() {
          var s = document.createElement('script')
          s.async = true
          s.src = 'https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__'
          document.head.appendChild(s)
        }
        if ('requestIdleCallback' in window) requestIdleCallback(cargar, { timeout: 3000 })
        else setTimeout(cargar, 1)
      })
    </script>
    <!-- ga:fin -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
