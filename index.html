<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ARCHO — Diseño y construcción, un solo proceso.</title>
    <meta
      name="description"
      content="ARCHO es un estudio integral de arquitectura y construcción con presencia en San Luis Potosí, Querétaro y Guanajuato."
    />
    <meta name="author" content="ARCHO Estudio" />
    <meta name="theme-color" content="#0A0A0A" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARCHO — Diseño y construcción, un solo proceso." />
    <meta
      property="og:description"
      content="Arquitectura, obra civil, estructuras, cimentación y supervisión — un estudio, ocho disciplinas."
    />
    <!-- TODO(fase 7): generar og-image propia y servirla desde /public. La original apuntaba a un preview de Lovable en r2.dev. -->
    <!-- <meta property="og:image" content="/og-image.jpg" /> -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARCHO — Arquitectura, estructura, visión" />
    <meta
      name="twitter:description"
      content="ARCHO es un estudio contemporáneo de arquitectura y construcción que integra diseño y obra en un mismo proceso. San Luis Potosí · Querétaro · Guanajuato."
    />

    <!-- El logo es el elemento LCP de la home (marca de agua del hero) y además
         aparece en la cabecera y el pie de todas las rutas. -->
    <link rel="preload" as="image" href="/archo-logo.png" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La hoja de Google Fonts bloqueaba el render 844 ms. Con media="print" el
         navegador la descarga sin bloquear y `onload` la activa al llegar. El
         texto se pinta antes con la fuente de sistema y cambia al cargar, que es
         justo lo que ya hacía `display=swap`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@400&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@400&display=swap"
      />
    </noscript>
  </head>

  </body>
