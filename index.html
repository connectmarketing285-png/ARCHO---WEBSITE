<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ARCHO — Diseño y construcción, un solo proceso.</title>
    <meta
      name="description"
      content="ARCHO es un estudio integral de arquitectura y construcción con presencia en San Luis Potosí, Querétaro, Guanajuato, Monterrey, Guadalajara y Baja California."
    />
    <meta name="author" content="ARCHO Estudio" />
    <meta name="theme-color" content="#0A0A0A" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARCHO — Diseño y construcción, un solo proceso." />
    <meta
      property="og:description"
      content="Arquitectura, obra civil, estructuras, cimentación y supervisión — un estudio, ocho disciplinas."
    />
    <!-- TODO(fase 7): generar og-image propia y servirla desde /public. La original apuntaba a un preview de Lovable en r2.dev. -->
    <!-- <meta property="og:image" content="/og-image.jpg" /> -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARCHO — Arquitectura, estructura, visión" />
    <meta
      name="twitter:description"
      content="ARCHO es un estudio contemporáneo de arquitectura y construcción que integra diseño y obra en un mismo proceso. San Luis Potosí · Querétaro · Guanajuato · Monterrey · Guadalajara · Baja California."
    />

    <!-- El logo es el elemento LCP de la home (marca de agua del hero) y además
         aparece en la cabecera y el pie de todas las rutas. -->
    <!--
      Datos estructurados para búsqueda local. Van en el HTML estático y no
      inyectados desde React: esto es una SPA, así que lo que monta React no
      está en la respuesta inicial que leen los rastreadores.

      `geo` lleva las coordenadas exactas de la oficina, facilitadas por el
      cliente. Antes se omitía porque la dirección no resuelve en las bases de
      geocodificación abiertas y un valor aproximado en datos estructurados es
      peor que ninguno: Google lo toma como la ubicación declarada del negocio.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "@id": "https://archo.com.mx/#organizacion",
        "name": "ARCHO Constructora",
        "alternateName": "ARCHO Estudio",
        "url": "https://archo.com.mx/",
        "logo": "https://archo.com.mx/archo-lockup.png",
        "image": "https://archo.com.mx/archo-lockup.png",
        "description": "Estudio integral de arquitectura y construcción. Diseño arquitectónico y ejecución de obra como un solo proceso.",
        "email": "admin@archo.com.mx",
        "telephone": "+52 440 122 2002",
        "foundingDate": "2011",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Prol, Santos Degollado 1137, Tangamanga, Cuarto piso",
          "addressLocality": "San Luis Potosí",
          "addressRegion": "S.L.P.",
          "postalCode": "78269",
          "addressCountry": "MX"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 22.143511,
          "longitude": -100.996727
        },
        "hasMap": "https://www.google.com/maps/search/?api=1&query=22.143511,-100.996727",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "19:00"
          }
        ],
        "areaServed": [
          { "@type": "AdministrativeArea", "name": "San Luis Potosí" },
          { "@type": "AdministrativeArea", "name": "Querétaro" },
          { "@type": "AdministrativeArea", "name": "Guanajuato" },
          { "@type": "AdministrativeArea", "name": "Monterrey" },
          { "@type": "AdministrativeArea", "name": "Guadalajara" },
          { "@type": "AdministrativeArea", "name": "Baja California" }
        ],
        "sameAs": [
          "https://www.instagram.com/archo.constructora",
          "https://www.linkedin.com/company/archo-constructora/"
        ],
        "knowsAbout": [
          "Estructura metálica",
          "Ingeniería estructural",
          "Instalaciones",
          "Estructura de concreto",
          "Obra residencial",
          "Carpintería",
          "Supervisión de obra"
        ]
      }
    </script>

    <link rel="preload" as="image" href="/archo-isotipo.png" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La hoja de Google Fonts bloqueaba el render 844 ms. Con media="print" el
         navegador la descarga sin bloquear y `onload` la activa al llegar. El
         texto se pinta antes con la fuente de sistema y cambia al cargar, que es
         justo lo que ya hacía `display=swap`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@800&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=Poppins:wght@800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
